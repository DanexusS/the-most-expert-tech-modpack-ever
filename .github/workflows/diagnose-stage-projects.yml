name: Diagnose stage project matrix

on:
  push:
    branches:
      - expert-overhaul-v1
    paths:
      - ".github/workflows/diagnose-stage-projects.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: expert-overhaul-v1
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            minecraft/config
            minecraft/docs
            minecraft/tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate project matrix
        run: python minecraft/tools/generate_stage_project_matrix.py

      - name: Generate diagnostic report
        shell: bash
        run: |
          python minecraft/tools/stage_project_matrix_quality_gate.py || true
          test -f minecraft/docs/STAGE_PROJECT_MATRIX_QUALITY_REPORT.md

      - name: Commit report and generated data
        shell: bash
        run: |
          first_failure=$(awk '/^## Failures/{active=1; next} active && /^- /{sub(/^- /, ""); print; exit}' minecraft/docs/STAGE_PROJECT_MATRIX_QUALITY_REPORT.md)
          failure_count=$(awk -F'\*\*' '/^- Failures:/{print $2; exit}' minecraft/docs/STAGE_PROJECT_MATRIX_QUALITY_REPORT.md)
          if [ -z "$failure_count" ]; then failure_count="unknown"; fi
          if [ -z "$first_failure" ]; then first_failure="PASS"; fi
          first_failure=$(printf '%s' "$first_failure" | cut -c1-140)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            minecraft/config/ftbquests/quests/chapters/v1_stage_project_matrix.snbt \
            minecraft/config/ftbquests/quests/lang/en_us.snbt \
            minecraft/config/ftbquests/quests/lang/ru_ru.snbt \
            minecraft/docs/STAGE_PROJECT_MATRIX_QUALITY_REPORT.md
          if git diff --cached --quiet; then
            echo "Diagnostic files already synchronized."
            exit 0
          fi
          git commit -m "diagnostic: stage matrix failures=${failure_count}; ${first_failure}"
          git push origin HEAD:expert-overhaul-v1
