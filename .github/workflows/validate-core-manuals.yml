name: Validate curated manuals and product readiness

on:
  push:
    branches:
      - expert-overhaul-v1
    paths:
      - "minecraft/config/ftbquests/quests/chapters/core_technology_manual_*.snbt"
      - "minecraft/config/ftbquests/quests/lang/*.snbt"
      - "minecraft/docs/*REPORT.md"
      - "minecraft/tools/core_manual_quality_gate.py"
      - "minecraft/tools/v1_product_readiness.py"
      - ".github/workflows/validate-core-manuals.yml"

permissions:
  contents: write

concurrency:
  group: expert-pack-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source directories
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            minecraft/config
            minecraft/docs
            minecraft/kubejs
            minecraft/tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gate curated manual quality
        run: python minecraft/tools/core_manual_quality_gate.py

      - name: Refresh quest quality report
        run: python minecraft/tools/quest_quality_audit.py

      - name: Validate all scripts quests and localization
        run: python minecraft/tools/static_validate.py

      - name: Classify strict product readiness
        run: python minecraft/tools/v1_product_readiness.py

      - name: Commit generated reports
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Manual and product reports are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            minecraft/docs/CORE_MANUAL_QUALITY_REPORT.md \
            minecraft/docs/QUEST_QUALITY_REPORT.md \
            minecraft/docs/V1_PRODUCT_READINESS.md
          git commit -m "automation: refresh manual quality and v1 product readiness"
          git push origin HEAD:${GITHUB_REF_NAME}
