name: Validate expert modpack

on:
  push:
    branches:
      - expert-overhaul-v1
    paths:
      - "flame/manifest.json"
      - "minecraft/**"
      - ".github/workflows/validate-pack.yml"
  pull_request:
    paths:
      - "flame/manifest.json"
      - "minecraft/**"
      - ".github/workflows/validate-pack.yml"

permissions:
  contents: write

concurrency:
  group: expert-pack-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out source directories
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            flame/manifest.json
            minecraft/config
            minecraft/docs
            minecraft/kubejs
            minecraft/tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build manifest-backed mod guide registry
        run: python minecraft/tools/build_mod_guide_registry.py

      - name: Synchronize bilingual expert quest localization
        run: python minecraft/tools/sync_expert_localization.py

      - name: Synchronize engineering guide localization
        run: python minecraft/tools/sync_engineering_guide_localization.py

      - name: Upgrade legacy expert progression tasks
        run: python minecraft/tools/upgrade_expert_progression.py

      - name: Upgrade legacy expert progression guidance
        run: python minecraft/tools/upgrade_expert_progression_localization.py

      - name: Upgrade Create core-route tasks
        run: python minecraft/tools/upgrade_create_core.py

      - name: Upgrade Create core-route guidance
        run: python minecraft/tools/upgrade_create_core_localization.py

      - name: Upgrade IE core-route tasks
        run: python minecraft/tools/upgrade_ie_core.py

      - name: Upgrade IE core-route guidance
        run: python minecraft/tools/upgrade_ie_core_localization.py

      - name: Upgrade MI core route
        run: python minecraft/tools/upgrade_mi_core.py

      - name: Upgrade AE2 core route
        run: python minecraft/tools/upgrade_ae2_core.py

      - name: Upgrade Mekanism core route
        run: python minecraft/tools/upgrade_mekanism_core.py

      - name: Tune combat profiles to modeled limits
        run: python minecraft/tools/tune_combat_profiles.py

      - name: Calculate theoretical balance
        run: python minecraft/tools/theoretical_balance.py

      - name: Audit quest quality
        run: python minecraft/tools/quest_quality_audit.py

      - name: Audit progression contract
        run: python minecraft/tools/progression_contract_audit.py

      - name: Audit gated-item bypasses
        run: python minecraft/tools/bypass_audit.py

      - name: Audit guide coverage for all manifest projects
        run: python minecraft/tools/mod_guide_coverage_audit.py

      - name: Gate Create core-route quality
        run: python minecraft/tools/create_core_quality_gate.py

      - name: Gate IE core-route quality
        run: python minecraft/tools/ie_core_quality_gate.py

      - name: Gate MI core-route quality
        run: python minecraft/tools/mi_core_quality_gate.py

      - name: Gate AE2 core-route quality
        run: python minecraft/tools/ae2_core_quality_gate.py

      - name: Gate Mekanism core-route quality
        run: python minecraft/tools/mekanism_core_quality_gate.py

      - name: Validate scripts, quests and localization
        run: python minecraft/tools/static_validate.py

      - name: Classify v1 readiness
        run: python minecraft/tools/v1_readiness.py

      - name: Commit generated pack metadata
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated pack metadata is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            minecraft/config/mod_guide_registry.json \
            minecraft/config/ftbquests/quests/chapters/expert_progression.snbt \
            minecraft/config/ftbquests/quests/chapters/create.snbt \
            minecraft/config/ftbquests/quests/chapters/immersive_engineering.snbt \
            "minecraft/config/ftbquests/quests/chapters/Modern Industrialization.snbt" \
            minecraft/config/ftbquests/quests/chapters/applied_energistics_2.snbt \
            minecraft/config/ftbquests/quests/chapters/mekanism_part_1.snbt \
            minecraft/config/ftbquests/quests/lang/en_us.snbt \
            minecraft/config/ftbquests/quests/lang/ru_ru.snbt \
            minecraft/kubejs/server_scripts/combat_scaling.js \
            minecraft/docs/THEORETICAL_BALANCE_REPORT.md \
            minecraft/docs/QUEST_QUALITY_REPORT.md \
            minecraft/docs/PROGRESSION_CONTRACT_REPORT.md \
            minecraft/docs/BYPASS_AUDIT_REPORT.md \
            minecraft/docs/MOD_GUIDE_COVERAGE_REPORT.md \
            minecraft/docs/CREATE_CORE_QUALITY_REPORT.md \
            minecraft/docs/IE_CORE_QUALITY_REPORT.md \
            minecraft/docs/MI_CORE_QUALITY_REPORT.md \
            minecraft/docs/AE2_CORE_QUALITY_REPORT.md \
            minecraft/docs/MEKANISM_CORE_QUALITY_REPORT.md \
            minecraft/docs/V1_READINESS.md
          git commit -m "automation: refresh v1 product and coverage reports"
          git push origin HEAD:${TARGET_BRANCH}
