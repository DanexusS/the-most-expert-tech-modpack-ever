name: Validate expert modpack

on:
  push:
    branches:
      - expert-overhaul-v1
  pull_request:
    paths:
      - "minecraft/**"
      - ".github/workflows/validate-pack.yml"

permissions:
  contents: write

concurrency:
  group: expert-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out source directories
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            minecraft/config
            minecraft/docs
            minecraft/kubejs
            minecraft/tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Synchronize bilingual expert quest localization
        run: python minecraft/tools/sync_expert_localization.py

      - name: Synchronize engineering guide localization
        run: python minecraft/tools/sync_engineering_guide_localization.py

      - name: Upgrade legacy expert progression tasks
        run: python minecraft/tools/upgrade_expert_progression.py

      - name: Upgrade legacy expert progression guidance
        run: python minecraft/tools/upgrade_expert_progression_localization.py

      - name: Tune combat profiles to modeled limits
        run: python minecraft/tools/tune_combat_profiles.py

      - name: Calculate theoretical balance
        run: python minecraft/tools/theoretical_balance.py

      - name: Audit quest quality
        run: python minecraft/tools/quest_quality_audit.py

      - name: Validate scripts, quests and localization
        run: python minecraft/tools/static_validate.py

      - name: Commit generated pack metadata
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated pack metadata is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            minecraft/config/ftbquests/quests/chapters/expert_progression.snbt \
            minecraft/config/ftbquests/quests/lang/en_us.snbt \
            minecraft/config/ftbquests/quests/lang/ru_ru.snbt \
            minecraft/kubejs/server_scripts/combat_scaling.js \
            minecraft/docs/THEORETICAL_BALANCE_REPORT.md \
            minecraft/docs/QUEST_QUALITY_REPORT.md
          git commit -m "automation: apply modeled balance and quest upgrades"
          git push origin HEAD:${TARGET_BRANCH}
