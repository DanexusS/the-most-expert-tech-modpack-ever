name: Generate Core Technology Manual V

on:
  push:
    branches:
      - expert-overhaul-v1
    paths:
      - "minecraft/config/guide_sources/manual5_*.json"
      - "minecraft/tools/manual_generator_common.py"
      - "minecraft/tools/generate_core_technology_manual_5.py"
      - ".github/workflows/generate-manual-5.yml"

permissions:
  contents: write

concurrency:
  group: manual-5-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out quest sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            minecraft/config
            minecraft/docs
            minecraft/kubejs
            minecraft/tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate fifth manual
        run: python minecraft/tools/generate_core_technology_manual_5.py

      - name: Validate generated chapter
        run: python minecraft/tools/static_validate.py

      - name: Commit generated chapter and localization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Manual V is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            minecraft/config/ftbquests/quests/chapters/core_technology_manual_5.snbt \
            minecraft/config/ftbquests/quests/lang/en_us.snbt \
            minecraft/config/ftbquests/quests/lang/ru_ru.snbt
          git commit -m "quests: generate Core Technology Manual V"
          git push origin HEAD:${GITHUB_REF_NAME}
