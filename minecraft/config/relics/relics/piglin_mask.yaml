                    # Modifier applied to the base value of the stat, depending on the [upgradeOperation] parameter.
                    upgradeModifier: 0.4286
                    # Type of mathematical operation used to calculate the stat's value based on the ability level.
                    upgradeOperation: relics:multiplicative_base
